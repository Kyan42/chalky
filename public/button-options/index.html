<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chalky · Button options</title><style>
@font-face{font-family:Instrument;src:url('/fonts/InstrumentSans-Regular.ttf')}@font-face{font-family:Serif;src:url('/fonts/InstrumentSerif-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#f7f5ef;color:#302b24;font-family:Instrument,system-ui}header{padding:40px 5% 20px}h1{font:46px Serif;margin:0 0 10px}header p{color:#81796b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:12px 5% 50px}article{border:1px solid #e2dccf;padding:22px;min-height:410px;display:flex;align-items:center;flex-direction:column}h2{font-size:15px;align-self:flex-start;font-weight:400;margin:0}img{width:210px;height:210px;object-fit:contain;margin:8px 0 20px}button{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:58px;padding:16px 28px;border:1px solid transparent;font:600 17px Instrument, sans-serif;cursor:pointer;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.08);transform:translateY(-2px)}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #bc870b;outline-offset:5px}button svg{width:20px;height:24px}.hint{font-size:12px;color:#81796b;margin:16px 0 0}.one{background:#302b24;color:#fffaf0}.one svg{color:#dfb54f}.two{background:#bc870b;color:#211c12}.three{background:transparent;color:#302b24;border:1.5px solid #302b24}.four{background:#ebe0c0;color:#55401d;border-color:#c9ad68;border-radius:6px}.five{background:#45553c;color:#fffaf0;border-radius:4px}.five svg{color:#e1c269}.six{background:#ad6448;color:#fffaf0;border-radius:8px}.seven{background:#302b24;color:#fffaf0;border-radius:999px}.seven svg{color:#dfb54f}.eight{background:#fffaf0;color:#302b24;border:1.5px solid #302b24;box-shadow:4px 4px 0 #bc870b}.nine{background:#735447;color:#fffaf0;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.ten{background:#e7d395;color:#463718;border:0;border-bottom:3px solid #a88937;border-radius:12px}.note{min-height:20px;font-size:12px;color:#776443;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style><header><h1>Ten ways to start talking.</h1><p>Same Chalky, same cream canvas. Compare color, shape, and weight. Click a button to mark a favorite.</p></header><main class="grid" id="grid"></main><script>
const options=[['one','01 · Charcoal rectangle'],['two','02 · Ochre rectangle'],['three','03 · Ink outline'],['four','04 · Soft parchment'],['five','05 · Forest green'],['six','06 · Terracotta'],['seven','07 · Charcoal pill'],['eight','08 · Paper with gold offset'],['nine','09 · Cocoa cut corners'],['ten','10 · Butter yellow raised']];
const mic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>';
document.getElementById('grid').innerHTML=options.map(([cls,title])=>`<article><h2>${title}</h2><img src="/mascot/seated.png" alt="Chalky sitting"><button class="${cls}" aria-pressed="false">${mic}Start talking</button><p class="hint">Turn on your microphone to begin</p><div class="note" aria-live="polite"></div></article>`).join('');
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.parentElement.querySelector('.note').textContent=on?'★ Marked as a favorite':''});
</script></html>
